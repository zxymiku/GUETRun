name: Build & Release APK

# 手动触发：编译 Android APK，并创建 GitHub Release。
# Release 说明自动汇总“上一次 Release 之后”的提交记录（按提交人分组）与统计。
on:
  workflow_dispatch:
    inputs:
      version:
        description: "版本号（例如 2.0.1）；留空读取 app/build.gradle"
        required: false
        type: string
      version_code:
        description: "versionCode（整数）；留空读取 app/build.gradle"
        required: false
        type: string
      tag:
        description: "Release 标签（例如 v2.0.1）；留空自动使用 v<版本号>"
        required: false
        type: string
      prerelease:
        description: "标记为 Pre-release"
        required: false
        type: boolean
        default: false
      publish:
        description: "创建 GitHub Release（取消勾选则只编译并保留 Actions 产物）"
        required: false
        type: boolean
        default: true

run-name: "Release ${{ inputs.tag || inputs.version || 'auto' }}"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-release:
    name: Build APK and publish release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      INPUT_VERSION: ${{ inputs.version }}
      INPUT_VERSION_CODE: ${{ inputs.version_code }}
      INPUT_TAG: ${{ inputs.tag }}
      INPUT_PUBLISH: ${{ inputs.publish }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Resolve version, tag and previous release
        id: meta
        shell: bash
        run: |
          set -euo pipefail

          VERSION="${INPUT_VERSION:-}"
          VERSION_CODE="${INPUT_VERSION_CODE:-}"

          if [ -z "$VERSION" ]; then
            VERSION=$(sed -n -E "s/.*versionName '([^']*)'.*/\1/p" app/build.gradle | head -n1)
          fi
          if [ -z "$VERSION_CODE" ]; then
            VERSION_CODE=$(sed -n -E "s/.*versionCode ([0-9]+).*/\1/p" app/build.gradle | head -n1)
          fi

          if [ -z "$VERSION" ] || [ -z "$VERSION_CODE" ]; then
            echo "::error::无法从 app/build.gradle 读取版本号，请检查文件格式"
            exit 1
          fi
          if ! [[ "$VERSION" =~ ^[0-9]+(\.[0-9]+){0,3}([-+][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::版本号格式无效：$VERSION（示例：2.0.1、2.1.0-beta.1）"
            exit 1
          fi
          if ! [[ "$VERSION_CODE" =~ ^(0|[1-9][0-9]*)$ ]]; then
            echo "::error::versionCode 必须是非负整数且不能有前导零：$VERSION_CODE"
            exit 1
          fi

          # 仅修改本次 runner 的工作区，保证 APK 内版本与 Release 标签一致。
          sed -i -E "s/versionCode [0-9]+/versionCode ${VERSION_CODE}/" app/build.gradle
          sed -i -E "s/versionName '[^']*'/versionName '${VERSION}'/" app/build.gradle

          BUILT_VERSION=$(sed -n -E "s/.*versionName '([^']*)'.*/\1/p" app/build.gradle | head -n1)
          if [ "$BUILT_VERSION" != "$VERSION" ]; then
            echo "::error::写入版本号失败：期望 $VERSION，实际 $BUILT_VERSION"
            exit 1
          fi

          TAG="${INPUT_TAG:-v${VERSION}}"
          if ! [[ "$TAG" =~ ^[A-Za-z0-9][A-Za-z0-9._+-]*$ ]]; then
            echo "::error::标签只能包含字母、数字、点、下划线、加号和短横线：$TAG"
            exit 1
          fi
          if ! git check-ref-format "refs/tags/$TAG"; then
            echo "::error::标签格式无效：$TAG"
            exit 1
          fi

          if [ "${INPUT_PUBLISH:-true}" = "true" ] && git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "::error::标签 $TAG 已存在。请提升 version，或指定新的 tag。"
            exit 1
          fi

          # 读取最近一次已发布的 Release（含 Pre-release，排除 draft）。
          PREV_TAG=""
          if [ -n "${GH_TOKEN:-}" ]; then
            PREV_TAG=$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
              --jq '[.[] | select(.draft == false)] | sort_by(.created_at) | reverse | .[0].tag_name // ""' \
              2>/dev/null || true)
          fi

          if [ -n "$PREV_TAG" ] && ! git rev-parse -q --verify "refs/tags/${PREV_TAG}^{commit}" >/dev/null; then
            git fetch --quiet origin "refs/tags/${PREV_TAG}:refs/tags/${PREV_TAG}" || true
          fi
          if [ -n "$PREV_TAG" ]; then
            if ! git rev-parse -q --verify "refs/tags/${PREV_TAG}^{commit}" >/dev/null ||
               ! git merge-base --is-ancestor "$PREV_TAG" HEAD 2>/dev/null; then
              echo "::warning::上次发布标签 $PREV_TAG 不在当前历史中，将按首次发布生成说明"
              PREV_TAG=""
            fi
          fi

          {
            echo "version=$VERSION"
            echo "version_code=$VERSION_CODE"
            echo "tag=$TAG"
            echo "previous_tag=$PREV_TAG"
          } >> "$GITHUB_OUTPUT"

          echo "版本：$VERSION（versionCode $VERSION_CODE）"
          echo "标签：$TAG"
          echo "上次发布：${PREV_TAG:-（无，首次发布）}"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35 platform and build-tools
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Run Java checks
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/test-classes"
          javac -encoding UTF-8 -d "$RUNNER_TEMP/test-classes" \
            app/src/main/java/com/local/runsimulator/RunMath.java \
            app/src/main/java/com/local/runsimulator/MapGeometry.java \
            app/src/main/java/com/local/runsimulator/ActivityGenerator.java \
            app/src/main/java/com/local/runsimulator/FitWriter.java \
            tests/RunMathTest.java \
            tests/MapGeometryTest.java \
            tests/ActivityTimeTest.java
          java -cp "$RUNNER_TEMP/test-classes" RunMathTest
          java -cp "$RUNNER_TEMP/test-classes" MapGeometryTest
          java -cp "$RUNNER_TEMP/test-classes" ActivityTimeTest

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon --console=plain --stacktrace

      - name: Package release asset
        id: asset
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"

          ASSET_NAME="run-data-generator-v${{ steps.meta.outputs.version }}-debug.apk"
          mkdir -p "$RUNNER_TEMP/release"
          cp "$APK" "$RUNNER_TEMP/release/$ASSET_NAME"

          SHA256=$(sha256sum "$RUNNER_TEMP/release/$ASSET_NAME" | awk '{print $1}')
          SIZE=$(stat -c%s "$RUNNER_TEMP/release/$ASSET_NAME")

          {
            echo "name=$ASSET_NAME"
            echo "path=$RUNNER_TEMP/release/$ASSET_NAME"
            echo "sha256=$SHA256"
            echo "size=$SIZE"
          } >> "$GITHUB_OUTPUT"

          echo "APK: $ASSET_NAME ($SIZE bytes)"
          echo "SHA-256: $SHA256"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: run-data-generator-v${{ steps.meta.outputs.version }}-debug
          path: ${{ runner.temp }}/release/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Generate release notes
        id: notes
        shell: bash
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          TAG: ${{ steps.meta.outputs.tag }}
          PREVIOUS_TAG: ${{ steps.meta.outputs.previous_tag }}
          ASSET_NAME: ${{ steps.asset.outputs.name }}
          ASSET_SHA256: ${{ steps.asset.outputs.sha256 }}
          ASSET_SIZE: ${{ steps.asset.outputs.size }}
        run: |
          set -euo pipefail
          NOTES="$RUNNER_TEMP/release-notes.md"

          bash .github/scripts/generate-release-notes.sh \
            --from "$PREVIOUS_TAG" \
            --to HEAD \
            --version "$VERSION" \
            --tag "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --output "$NOTES"

          ASSET_SIZE_HUMAN=$(numfmt --to=iec-i --suffix=B "$ASSET_SIZE" 2>/dev/null || echo "${ASSET_SIZE} B")

          {
            echo ""
            echo "## 发布附件"
            echo ""
            echo "| 文件 | 大小 | SHA-256 |"
            echo "| --- | ---: | --- |"
            echo "| \`${ASSET_NAME}\` | ${ASSET_SIZE_HUMAN} | \`${ASSET_SHA256}\` |"
            echo ""
            echo "> 该 APK 使用 Android 调试签名，仅用于个人测试；下载后请核对 SHA-256。"
          } >> "$NOTES"

          echo "path=$NOTES" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        if: ${{ inputs.publish }}
        shell: bash
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          TAG: ${{ steps.meta.outputs.tag }}
          NOTES_PATH: ${{ steps.notes.outputs.path }}
          ASSET_PATH: ${{ steps.asset.outputs.path }}
          ASSET_NAME: ${{ steps.asset.outputs.name }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail
          TITLE="v${VERSION} · 运动数据生成器"
          ARGS=(--title "$TITLE" --notes-file "$NOTES_PATH" --target "$GITHUB_SHA")
          if [ "$PRERELEASE" = "true" ]; then
            ARGS+=(--prerelease)
          fi
          gh release create "$TAG" "${ASSET_PATH}#${ASSET_NAME} (Android debug APK)" "${ARGS[@]}"

          echo "Release: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$TAG"

      - name: Write job summary
        if: always()
        shell: bash
        run: |
          {
            echo "## 发布摘要"
            echo ""
            echo "- 版本：\`${{ steps.meta.outputs.version }}\`（versionCode ${{ steps.meta.outputs.version_code }}）"
            echo "- 标签：\`${{ steps.meta.outputs.tag }}\`"
            echo "- 上次发布：\`${{ steps.meta.outputs.previous_tag }}\`"
            echo "- APK：\`${{ steps.asset.outputs.name }}\`"
            echo "- SHA-256：\`${{ steps.asset.outputs.sha256 }}\`"
            echo ""
            if [ "${{ inputs.publish }}" = "true" ]; then
              echo "Release 已创建：$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/${{ steps.meta.outputs.tag }}"
            else
              echo "未创建 Release（publish=false）；APK 已作为 Actions artifact 上传。"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
