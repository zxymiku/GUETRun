plugins {
    id 'com.android.application'
}

android {
    namespace 'com.local.runsimulator'
    compileSdk 35

    defaultConfig {
        applicationId 'com.local.runsimulator'
        minSdk 26
        targetSdk 35
        versionCode 9
        versionName '2.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        encoding 'UTF-8'
    }
}
