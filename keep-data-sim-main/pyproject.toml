[project]
name = "keep-data-sim"
version = "0.1.0"
description = "Generate realistic GPX/FIT workout files for running and cycling simulations"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
    { name = "Keep Data Simulator contributors" },
]
keywords = ["fitness", "gpx", "fit", "running", "cycling", "simulation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
]
dependencies = [
    "gpxpy>=1.6",
    "garmin-fit-sdk>=0.2",
    "numpy>=1.24",
    "tzdata>=2024.1; platform_system == 'Windows'",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[project.scripts]
keep-data-sim = "keep_data_sim.cli:main"

[project.urls]
Homepage = "https://github.com/StringsLi/keep-data-sim"
Repository = "https://github.com/StringsLi/keep-data-sim"
Issues = "https://github.com/StringsLi/keep-data-sim/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
